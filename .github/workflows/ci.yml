name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Bun is the package manager (version from package.json#packageManager);
      # Node.js runs the apps, tests and builds.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: bun install --frozen-lockfile

      - run: bun run format:check

      - run: bun run turbo run lint typecheck test test:e2e build

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    strategy:
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v7

      - run: docker build --file apps/${{ matrix.app }}/Dockerfile --tag glitch-craft-${{ matrix.app }}:ci .
