# Local infrastructure.
#   bun run db:up                                -> Postgres only (for `bun run dev`)
#   docker compose --profile app up --build     -> full stack in containers
name: glitch-craft

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: glitchcraft
      POSTGRES_PASSWORD: glitchcraft
      POSTGRES_DB: glitchcraft
    ports:
      - '${POSTGRES_PORT:-4712}:5432'
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U glitchcraft -d glitchcraft']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    profiles: [app]
    image: glitch-craft-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'dist/database/migrate.js']
    environment:
      DATABASE_URL: postgres://glitchcraft:glitchcraft@db:5432/glitchcraft
    depends_on:
      db:
        condition: service_healthy

  api:
    profiles: [app]
    image: glitch-craft-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4711
      DATABASE_URL: postgres://glitchcraft:glitchcraft@db:5432/glitchcraft
      CORS_ORIGINS: http://localhost:4710
      # The web container reaches the API over the private Docker network.
      TRUST_PROXY: uniquelocal
    ports:
      - '4711:4711'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4711/api/health/ready']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    profiles: [app]
    image: glitch-craft-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:4710
    environment:
      API_URL: http://api:4711
    ports:
      - '4710:4710'
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
